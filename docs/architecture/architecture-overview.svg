<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" role="img" aria-label="Big picture: internet shoppers reach one Application Load Balancer, which forwards each request to one of three identical app servers spread across two Availability Zones in private subnets. The app servers read and write a private PostgreSQL database, and reach the internet outbound only through a NAT instance in a public subnet.">
  <rect x="0" y="0" width="940" height="600" fill="#fbfaf6"/>
  <defs>
    <marker id="oA" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#1f6f8b"/></marker>
    <marker id="oB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#8a97a3"/></marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#233240">

    <rect x="350" y="18" width="240" height="40" rx="20" fill="#ffffff" stroke="#c9cfd4"/>
    <text x="470" y="43" text-anchor="middle" font-size="14" font-weight="600">Shoppers on the internet</text>

    <rect x="190" y="92" width="560" height="54" rx="8" fill="#f1ede3" stroke="#233240"/>
    <g transform="translate(202,99)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#8C4FFF"/>
      <circle cx="11" cy="18" r="2.8" fill="#fff"/><circle cx="26" cy="10" r="2.8" fill="#fff"/><circle cx="26" cy="26" r="2.8" fill="#fff"/>
      <path d="M13.5 18 L23 10 M13.5 18 L23 26" stroke="#fff" stroke-width="1.7" fill="none"/>
    </g>
    <text x="252" y="116" font-size="15" font-weight="700">Application Load Balancer</text>
    <text x="252" y="134" font-size="12" fill="#5b6b78">the one public entry point &#183; HTTP :80 &#183; health-checks every server on /health</text>

    <rect x="36" y="182" width="424" height="392" rx="12" fill="#f1f4f6" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="7 5"/>
    <rect x="480" y="182" width="424" height="392" rx="12" fill="#f1f4f6" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="52" y="204" font-size="13" font-weight="700" fill="#0f6ba0">Availability Zone A &#183; eu-north-1a</text>
    <text x="496" y="204" font-size="13" font-weight="700" fill="#0f6ba0">Availability Zone B &#183; eu-north-1b</text>

    <rect x="52" y="218" width="392" height="24" rx="4" fill="#3F8624"/>
    <text x="64" y="235" font-size="12" fill="#fff" font-weight="600">Public subnet</text>
    <rect x="496" y="218" width="392" height="24" rx="4" fill="#3F8624"/>
    <text x="508" y="235" font-size="12" fill="#fff" font-weight="600">Public subnet</text>

    <g transform="translate(72,256)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#ED7100"/>
      <rect x="10" y="10" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/>
      <rect x="15" y="15" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/>
    </g>
    <text x="118" y="272" font-size="13" font-weight="600">NAT instance</text>
    <text x="118" y="289" font-size="11.5" fill="#5b6b78">lets private servers reach the internet, outbound only</text>
    <text x="508" y="278" font-size="11.5" fill="#5b6b78">(a load-balancer node also runs here)</text>

    <rect x="52" y="322" width="392" height="24" rx="4" fill="#147EBA"/>
    <text x="64" y="339" font-size="12" fill="#fff" font-weight="600">Private subnet &#8212; no route to the internet</text>
    <rect x="496" y="322" width="392" height="24" rx="4" fill="#147EBA"/>
    <text x="508" y="339" font-size="12" fill="#fff" font-weight="600">Private subnet &#8212; no route to the internet</text>

    <g transform="translate(72,360)"><rect x="0" y="0" width="36" height="36" rx="6" fill="#ED7100"/><rect x="10" y="10" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/><rect x="15" y="15" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/></g>
    <g transform="translate(228,360)"><rect x="0" y="0" width="36" height="36" rx="6" fill="#ED7100"/><rect x="10" y="10" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/><rect x="15" y="15" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/></g>
    <g transform="translate(660,360)"><rect x="0" y="0" width="36" height="36" rx="6" fill="#ED7100"/><rect x="10" y="10" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/><rect x="15" y="15" width="12" height="12" fill="none" stroke="#fff" stroke-width="1.7"/></g>
    <text x="72" y="414" font-size="12" fill="#5b6b78">App server</text>
    <text x="228" y="414" font-size="12" fill="#5b6b78">App server</text>
    <text x="660" y="414" font-size="12" fill="#5b6b78">App server</text>

    <text x="470" y="446" text-anchor="middle" font-size="12.5" font-weight="600" fill="#155d75">3 identical copies &#8212; the Auto Scaling Group keeps 3 running (up to 4 under load)</text>
    <text x="470" y="478" text-anchor="middle" font-size="12.5" fill="#155d75" font-weight="600">read / write, port 5432</text>

    <rect x="52" y="504" width="600" height="52" rx="7" fill="#ffffff" stroke="#3334B9" stroke-width="1.5"/>
    <g transform="translate(64,512)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#3334B9"/>
      <ellipse cx="18" cy="11" rx="9" ry="3.4" fill="none" stroke="#fff" stroke-width="1.6"/>
      <path d="M9 11 v14 c0 1.9 4 3.4 9 3.4 s9 -1.5 9 -3.4 v-14" fill="none" stroke="#fff" stroke-width="1.6"/>
    </g>
    <text x="114" y="525" font-size="14" font-weight="700">PostgreSQL database (Amazon RDS)</text>
    <text x="114" y="543" font-size="11.5" fill="#5b6b78">private &#183; encrypted &#183; not reachable from the internet &#183; only the app servers can connect</text>

    <line x1="470" y1="58" x2="470" y2="88" stroke="#1f6f8b" stroke-width="2.6" marker-end="url(#oA)"/>
    <text x="484" y="78" font-size="12" fill="#155d75">a visitor request</text>
    <line x1="330" y1="146" x2="120" y2="356" stroke="#1f6f8b" stroke-width="2.6" marker-end="url(#oA)"/>
    <line x1="470" y1="146" x2="276" y2="356" stroke="#1f6f8b" stroke-width="2.6" marker-end="url(#oA)"/>
    <line x1="610" y1="146" x2="700" y2="356" stroke="#1f6f8b" stroke-width="2.6" marker-end="url(#oA)"/>
    <text x="486" y="300" font-size="12.5" fill="#155d75" font-weight="600">forwards to any one healthy server, port 8080</text>
    <line x1="120" y1="398" x2="230" y2="500" stroke="#1f6f8b" stroke-width="2.4" marker-end="url(#oA)"/>
    <line x1="678" y1="398" x2="420" y2="504" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#oA)"/>
    <path d="M108 360 C 96 320, 108 300, 118 292" fill="none" stroke="#8a97a3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#oB)"/>
    <line x1="118" y1="256" x2="118" y2="150" stroke="#8a97a3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#oB)"/>
    <text x="132" y="180" font-size="11" fill="#5b6b78">outbound: OS updates, fetch secrets</text>
  </g>
</svg>
