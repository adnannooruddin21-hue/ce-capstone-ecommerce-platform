<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1094" role="img" aria-label="AWS reference architecture for CloudCart. A browser reaches an internet-facing Application Load Balancer through the VPC's internet gateway. The ALB distributes to an EC2 Auto Scaling group (min 3, max 4) of Flask app servers spread across two Availability Zones in private app subnets. The app servers connect to a single-AZ Amazon RDS PostgreSQL primary in private database subnets (a DB subnet group spanning both AZs, no standby). Outbound internet for the private tier goes through a single NAT instance in a public subnet. At boot each server pulls its code bundle from Amazon S3 and its secrets from SSM Parameter Store, and continuously ships logs and metrics to Amazon CloudWatch.">
  <rect x="0" y="0" width="960" height="1094" fill="#fbfaf6"/>
  <defs>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#233240"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97a3"/></marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#1b2530">
    <rect x="430" y="16" width="44" height="28" rx="2" fill="none" stroke="#233240" stroke-width="1.8"/>
    <line x1="444" y1="48" x2="460" y2="48" stroke="#233240" stroke-width="1.8"/>
    <line x1="452" y1="44" x2="452" y2="48" stroke="#233240" stroke-width="1.8"/>
    <text x="486" y="26" font-size="11.5">Browser</text>
    <text x="486" y="41" font-size="10" fill="#5b6b78">no custom domain &#8212; the ALB's DNS name</text>
    <rect x="14" y="70" width="932" height="1010" rx="8" fill="none" stroke="#233240" stroke-width="1.6"/>
    <rect x="22" y="78" width="30" height="22" rx="3" fill="#233240"/>
    <text x="30" y="93" font-size="10" fill="#fff" font-weight="700">aws</text>
    <text x="62" y="94" font-size="13" font-weight="700">AWS Cloud</text>
    <text x="760" y="94" font-size="11" fill="#5b6b78">Region: eu-north-1 (Stockholm)</text>
    <g transform="translate(40,452)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#7AA116"/>
      <path d="M9 11 h16 l-2 15 h-12 z" fill="none" stroke="#fff" stroke-width="1.6"/>
    </g>
    <text x="26" y="504" font-size="11" font-weight="600">Amazon S3</text>
    <text x="26" y="518" font-size="9.5" fill="#5b6b78">Terraform state +</text>
    <text x="26" y="530" font-size="9.5" fill="#5b6b78">app code bundle</text>
    <g transform="translate(40,586)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#E7157B"/>
      <circle cx="14" cy="18" r="4.2" fill="none" stroke="#fff" stroke-width="1.6"/>
      <path d="M18 18 h9 M24 18 v4" stroke="#fff" stroke-width="1.6" fill="none"/>
    </g>
    <text x="20" y="638" font-size="11" font-weight="600">SSM Parameter</text>
    <text x="20" y="651" font-size="11" font-weight="600">Store</text>
    <text x="20" y="665" font-size="9.5" fill="#5b6b78">DB creds + app secret</text>
    <text x="20" y="677" font-size="9.5" fill="#5b6b78">(SecureString)</text>
    <g transform="translate(40,720)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#E7157B"/>
      <path d="M7 24 l5 -8 l4 5 l5 -11 l6 14" fill="none" stroke="#fff" stroke-width="1.6"/>
    </g>
    <text x="20" y="772" font-size="11" font-weight="600">Amazon CloudWatch</text>
    <text x="20" y="786" font-size="9.5" fill="#5b6b78">dashboard &#183; logs</text>
    <text x="20" y="798" font-size="9.5" fill="#5b6b78">4 alarms &#8594; SNS email</text>
    <rect x="150" y="250" width="760" height="814" rx="10" fill="none" stroke="#248814" stroke-width="2"/>
    <rect x="160" y="258" width="20" height="18" rx="3" fill="#248814"/>
    <text x="188" y="272" font-size="12.5" font-weight="700" fill="#1f6b12">Amazon VPC &#8212; 10.20.0.0/16</text>
    <g transform="translate(496,286)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#8C4FFF"/>
      <circle cx="17" cy="17" r="7.5" fill="none" stroke="#fff" stroke-width="1.6"/>
      <path d="M9.5 17 h15 M17 9.5 v15" stroke="#fff" stroke-width="1.3"/>
    </g>
    <text x="538" y="300" font-size="11" font-weight="600">Internet Gateway</text>
    <text x="538" y="313" font-size="9.5" fill="#5b6b78">the VPC's public entry / exit</text>
    <rect x="214" y="332" width="330" height="718" rx="8" fill="none" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="6 5"/>
    <rect x="566" y="332" width="330" height="718" rx="8" fill="none" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="228" y="352" font-size="11.5" font-weight="700" fill="#0f6ba0">Availability Zone 1 &#183; eu-north-1a</text>
    <text x="580" y="352" font-size="11.5" font-weight="700" fill="#0f6ba0">Availability Zone 2 &#183; eu-north-1b</text>
    <rect x="228" y="364" width="302" height="22" rx="3" fill="#3F8624"/>
    <text x="238" y="379" font-size="10.5" fill="#fff" font-weight="600">Public subnet &#183; 10.20.0.0/24</text>
    <rect x="580" y="364" width="302" height="22" rx="3" fill="#3F8624"/>
    <text x="590" y="379" font-size="10.5" fill="#fff" font-weight="600">Public subnet &#183; 10.20.1.0/24</text>
    <g transform="translate(250,400)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#ED7100"/>
      <rect x="9" y="9" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
      <rect x="14" y="14" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <text x="292" y="414" font-size="10.5" font-weight="600">NAT instance (t3.micro)</text>
    <text x="292" y="427" font-size="9.5" fill="#5b6b78">single NAT &#8212; Free Tier choice</text>
    <text x="590" y="414" font-size="9.5" fill="#5b6b78">(ALB node runs here)</text>
    <rect x="396" y="470" width="318" height="48" rx="6" fill="#ffffff" stroke="#8C4FFF" stroke-width="1.6"/>
    <g transform="translate(404,477)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#8C4FFF"/>
      <circle cx="10" cy="17" r="2.6" fill="#fff"/><circle cx="24" cy="10" r="2.6" fill="#fff"/><circle cx="24" cy="24" r="2.6" fill="#fff"/>
      <path d="M12.5 17 L21.5 10 M12.5 17 L21.5 24" stroke="#fff" stroke-width="1.5" fill="none"/>
    </g>
    <text x="448" y="490" font-size="11.5" font-weight="700">Application Load Balancer</text>
    <text x="448" y="505" font-size="9.5" fill="#5b6b78">internet-facing &#183; HTTP :80 &#183; /health check every 15s</text>
    <rect x="228" y="548" width="302" height="22" rx="3" fill="#147EBA"/>
    <text x="238" y="563" font-size="10.5" fill="#fff" font-weight="600">Private subnet (app) &#183; 10.20.10.0/24</text>
    <rect x="580" y="548" width="302" height="22" rx="3" fill="#147EBA"/>
    <text x="590" y="563" font-size="10.5" fill="#fff" font-weight="600">Private subnet (app) &#183; 10.20.11.0/24</text>
    <rect x="240" y="584" width="628" height="176" rx="8" fill="#fff6ef" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="252" y="602" font-size="10.5" font-weight="700" fill="#c0570a">Auto Scaling group &#183; app tier &#183; min 3 / desired 3 / max 4</text>
    <g transform="translate(280,626)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#ED7100"/>
      <rect x="9" y="9" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
      <rect x="14" y="14" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <g transform="translate(336,626)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#ED7100"/>
      <rect x="9" y="9" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
      <rect x="14" y="14" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <text x="280" y="678" font-size="10" fill="#5b6b78">EC2 &#183; Flask + gunicorn</text>
    <g transform="translate(690,626)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#ED7100"/>
      <rect x="9" y="9" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
      <rect x="14" y="14" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <text x="640" y="678" font-size="10" fill="#5b6b78">EC2 &#183; Flask + gunicorn</text>
    <text x="252" y="742" font-size="9.5" fill="#c0570a">scaling: target-tracking @ 50% CPU &#183; scheduled scale-in overnight</text>
    <rect x="228" y="792" width="302" height="22" rx="3" fill="#147EBA"/>
    <text x="238" y="807" font-size="10.5" fill="#fff" font-weight="600">Private subnet (database)</text>
    <rect x="580" y="792" width="302" height="22" rx="3" fill="#147EBA"/>
    <text x="590" y="807" font-size="10.5" fill="#fff" font-weight="600">Private subnet (database)</text>
    <rect x="240" y="828" width="628" height="204" rx="8" fill="#eef4fb" stroke="#147EBA" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="252" y="846" font-size="10.5" font-weight="700" fill="#0f6ba0">DB subnet group &#8212; spans both AZs</text>
    <g transform="translate(300,872)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#3334B9"/>
      <ellipse cx="17" cy="10" rx="8" ry="3.2" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path d="M9 10 v14 c0 1.8 3.6 3.2 8 3.2 s8 -1.4 8 -3.2 v-14" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <text x="344" y="884" font-size="11" font-weight="700">Amazon RDS &#183; PostgreSQL 16</text>
    <text x="344" y="898" font-size="9.5" fill="#5b6b78">db.t3.micro &#183; primary &#183; storage-encrypted</text>
    <text x="344" y="911" font-size="9.5" fill="#5b6b78">not publicly accessible &#183; 1-day automated backups</text>
    <rect x="600" y="864" width="248" height="86" rx="6" fill="none" stroke="#9fb0ba" stroke-width="1.3" stroke-dasharray="4 4"/>
    <text x="612" y="886" font-size="10" fill="#5b6b78">No standby instance here.</text>
    <text x="612" y="901" font-size="10" fill="#5b6b78">Single-AZ &#8212; Free Tier choice.</text>
    <text x="612" y="916" font-size="10" fill="#5b6b78">Multi-AZ = one setting to</text>
    <text x="612" y="929" font-size="10" fill="#5b6b78">enable in production.</text>
    <path d="M452 46 C 452 150, 500 220, 513 282" fill="none" stroke="#233240" stroke-width="1.8" marker-end="url(#mA)"/>
    <text x="470" y="150" font-size="9.5" fill="#233240">request in</text>
    <path d="M520 320 C 522 380, 540 430, 548 468" fill="none" stroke="#233240" stroke-width="1.8" marker-end="url(#mA)"/>
    <line x1="470" y1="518" x2="315" y2="622" stroke="#233240" stroke-width="1.7" marker-end="url(#mA)"/>
    <line x1="530" y1="518" x2="360" y2="622" stroke="#233240" stroke-width="1.7" marker-end="url(#mA)"/>
    <line x1="620" y1="518" x2="707" y2="622" stroke="#233240" stroke-width="1.7" marker-end="url(#mA)"/>
    <text x="560" y="560" font-size="9.5" fill="#233240">forward :8080</text>
    <line x1="337" y1="662" x2="330" y2="868" stroke="#233240" stroke-width="1.7" marker-end="url(#mA)"/>
    <path d="M707 662 C 700 760, 460 820, 340 868" fill="none" stroke="#233240" stroke-width="1.5" marker-end="url(#mA)"/>
    <text x="342" y="800" font-size="9.5" fill="#233240">SQL :5432</text>
    <path d="M286 626 C 250 560, 255 480, 267 436" fill="none" stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mB)"/>
    <path d="M284 400 C 330 360, 460 330, 496 312" fill="none" stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mB)"/>
    <text x="210" y="470" font-size="9" fill="#6a7783">outbound only</text>
    <path d="M240 640 C 150 640, 120 520, 76 486" fill="none" stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mB)"/>
    <path d="M240 660 C 150 660, 130 620, 76 606" fill="none" stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mB)"/>
    <path d="M240 690 C 160 700, 140 740, 76 740" fill="none" stroke="#8a97a3" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mB)"/>
    <text x="96" y="430" font-size="9" fill="#6a7783">at boot: pull code (S3) + secrets (SSM)</text>
    <text x="120" y="710" font-size="9" fill="#6a7783">always: logs + metrics</text>
  </g>
</svg>
