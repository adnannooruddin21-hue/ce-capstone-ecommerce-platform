name: drift-detection

# Runs terraform plan against the deployed state on a schedule. A non-empty
# plan means the live infrastructure has drifted from the code -> the job fails.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Detect drift
        id: plan
        run: terraform plan -detailed-exitcode -no-color
        # exit 0 = no drift, 1 = error, 2 = drift detected (job fails)

      - name: Report drift
        if: failure() && steps.plan.outputs.exitcode == '2'
        run: echo "::warning::Infrastructure has drifted from Terraform state. Review the plan output above."
